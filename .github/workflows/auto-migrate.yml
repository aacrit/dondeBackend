name: Auto-apply migrations on merge to main

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref vwbzkgsxmgwcvmvuxnbe
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dry run — show pending migrations
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply pending migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify database health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://vwbzkgsxmgwcvmvuxnbe.supabase.co/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPAB_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPAB_ANON_KEY }}")
          echo "Health check HTTP code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Database health check failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Database healthy after migration"
