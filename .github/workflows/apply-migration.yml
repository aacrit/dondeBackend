name: Apply Database Migration

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration file to apply (e.g., 20260305000001_rpc_v10.sql)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run only (true/false)'
        required: false
        default: 'false'
      include_all:
        description: 'Include all pending migrations regardless of order (true/false)'
        required: false
        default: 'false'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref vwbzkgsxmgwcvmvuxnbe
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Show pending migrations (dry run)
        if: inputs.dry_run == 'true'
        run: supabase db push --dry-run ${{ inputs.include_all == 'true' && '--include-all' || '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        if: inputs.dry_run != 'true'
        run: supabase db push ${{ inputs.include_all == 'true' && '--include-all' || '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify V10 RPC exists
        if: inputs.dry_run != 'true'
        run: |
          echo "Verifying get_candidates_v10 was created..."
          curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            "https://vwbzkgsxmgwcvmvuxnbe.supabase.co/rest/v1/rpc/get_candidates_v10" \
            -H "apikey: ${{ secrets.SUPAB_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPAB_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p_limit": 1}'
