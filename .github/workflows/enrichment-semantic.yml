name: Semantic Descriptors Enrichment (V11)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        type: boolean
        default: true

jobs:
  migrate-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Step 1: Apply semantic_descriptors columns via Supabase Management API
      # (Can't use db push since migration files may not be on the checked-out branch)
      - name: Ensure semantic_descriptors columns exist
        run: |
          SQL=$(cat <<'EOSQL'
          ALTER TABLE restaurant_review_intelligence
            ADD COLUMN IF NOT EXISTS semantic_descriptors text[] DEFAULT '{}',
            ADD COLUMN IF NOT EXISTS best_for_scenarios text[] DEFAULT '{}',
            ADD COLUMN IF NOT EXISTS comparable_restaurants text[] DEFAULT '{}';

          CREATE INDEX IF NOT EXISTS idx_ri_semantic ON restaurant_review_intelligence USING GIN (semantic_descriptors);
          CREATE INDEX IF NOT EXISTS idx_ri_scenarios ON restaurant_review_intelligence USING GIN (best_for_scenarios);
          CREATE INDEX IF NOT EXISTS idx_ri_comparable ON restaurant_review_intelligence USING GIN (comparable_restaurants);
          EOSQL
          )

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/vwbzkgsxmgwcvmvuxnbe/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(echo "$SQL" | jq -Rs .)}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Migration failed with HTTP $HTTP_CODE"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Step 2: Run the enrichment pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Run semantic descriptors enrichment
        run: npx tsx pipelines/enrichment-review-intelligence.ts
        working-directory: scripts
        env:
          SUPAB_URL: ${{ secrets.SUPAB_URL }}
          SUPAB_SERVICE_ROLE_KEY: ${{ secrets.SUPAB_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
