name: Semantic Descriptors Enrichment (V11)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        type: boolean
        default: true

jobs:
  migrate-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Step 1: Apply semantic_descriptors columns via direct SQL
      # (Using supabase db execute instead of db push, since migration
      # files may not be on the checked-out branch)
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref vwbzkgsxmgwcvmvuxnbe
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Ensure semantic_descriptors columns exist
        run: |
          supabase db execute --project-ref vwbzkgsxmgwcvmvuxnbe <<'EOSQL'
          ALTER TABLE restaurant_review_intelligence
            ADD COLUMN IF NOT EXISTS semantic_descriptors text[] DEFAULT '{}',
            ADD COLUMN IF NOT EXISTS best_for_scenarios text[] DEFAULT '{}',
            ADD COLUMN IF NOT EXISTS comparable_restaurants text[] DEFAULT '{}';

          CREATE INDEX IF NOT EXISTS idx_ri_semantic ON restaurant_review_intelligence USING GIN (semantic_descriptors);
          CREATE INDEX IF NOT EXISTS idx_ri_scenarios ON restaurant_review_intelligence USING GIN (best_for_scenarios);
          CREATE INDEX IF NOT EXISTS idx_ri_comparable ON restaurant_review_intelligence USING GIN (comparable_restaurants);
          EOSQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Step 2: Run the enrichment pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Run semantic descriptors enrichment
        run: npx tsx pipelines/enrichment-review-intelligence.ts
        working-directory: scripts
        env:
          SUPAB_URL: ${{ secrets.SUPAB_URL }}
          SUPAB_SERVICE_ROLE_KEY: ${{ secrets.SUPAB_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
